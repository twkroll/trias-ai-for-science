[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trias-threebody-demo"
version = "0.1.0"
description = "Minimal three-body demonstrator for the Reality-Theory-Computation Trias project"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trias-demo = "trias_demo.experiment:main"
trias-ml-demo = "trias_demo.ml_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
